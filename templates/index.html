<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker | Double-Ended Queue (collections.deque)</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">


    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-card: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #238636;
            --accent-green-hover: #2ea043;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            max-width: 800px;
            width: 100%;
        }

        .app-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 15px;
            border: 1px solid rgba(88, 166, 255, 0.2);
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-blue);
            border-radius: 50%;
            margin-right: 8px;
        }

        .header-title {
            font-size: 32px;
            font-weight: 800;
            margin: 0 0 10px 0;
            color: #ffffff;
        }

        .gradient-text {
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-subtitle {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
            max-width: 650px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .card-header h2 {
            font-size: 18px;
            margin: 0;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-hint {
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        .textarea-wrapper {
            position: relative;
        }

        textarea {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            padding: 12px;
            font-size: 15px;
            font-family: inherit;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.15);
        }

        .clear-input-btn {
            position: absolute;
            right: 12px;
            top: 12px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        .clear-input-btn:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <div class="header-badge">
                <span class="badge-dot"></span>
                <span>Python Flask &bull; collections.deque</span>
            </div>
            <h1 class="header-title">Palindrome <span class="gradient-text">Checker</span></h1>
            <p class="header-subtitle">
                High-performance palindrome verification leveraging Python's <code>collections.deque</code> 
                with <span class="highlight">O(1)</span> double-ended character comparison.
            </p>
        </header>

        <main class="main-content">
            <section class="card input-card">
                <div class="card-header">
                    <h2><span>🔍</span> Test Input</h2>
                    <span class="card-hint">Supports words, phrases &amp; numbers</span>
                </div>

                <form id="palindromeForm" action="/" method="POST">
                    <div class="input-group">
                        <label for="inputText" class="form-label">Enter text to evaluate:</label>
                        <div class="textarea-wrapper">
                            <textarea 
                                id="inputText" 
                                name="text" 
                                rows="3" 
                                placeholder="Type or click a sample below (e.g. 'A man, a plan, a canal: Panama')"
                                required
                            >{{ input_text if input_text is defined else '' }}</textarea>
                            <button type="button" id="clearBtn" class="clear-input-btn" title="clear text">&times;</button>
                        </div>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <!-- Embedded JavaScript (जावास्क्रिप्ट यहाँ है) -->
    <script>
        document.getElementById('clearBtn').addEventListener('click', function() {
            document.getElementById('inputText').value = '';
            document.getElementById('inputText').focus();
        });
    </script>
</body>
</html>
